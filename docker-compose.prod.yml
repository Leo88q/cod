# Standalone production topology: docker compose -f docker-compose.prod.yml up -d --build
# Requires .env with PUBLIC_DOMAIN, PUBLIC_URL, Telegram/payment credentials, secrets.
services:
  api:
    build: .
    env_file: .env
    environment:
      ALLOW_ANON: "0"
      SCHEDULER_ENABLED: "0"
      DB_PATH: /app/storage/scena.db
      MEDIA_DIR: /app/storage/media
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*", "--no-access-log"]
    volumes: ["./storage:/app/storage"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
    # No host port: only trusted private ingress may reach this service.
  worker:
    build: .
    env_file: .env
    environment:
      ALLOW_ANON: "0"
      DB_PATH: /app/storage/scena.db
      MEDIA_DIR: /app/storage/media
    command: ["python", "-m", "app.worker"]
    volumes: ["./storage:/app/storage"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
  ingress:
    image: caddy:2
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
