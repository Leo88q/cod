name: tests
on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install deps
        run: |
          python -m pip install -q -c requirements.lock.txt -r requirements.txt -r requirements-dev.txt
      - name: py_compile
        run: python -m py_compile app/*.py scripts/*.py
      - name: node --check
        run: node --check app/static/app.js
      - name: UI DOM smoke tests
        run: npm ci --ignore-scripts && npm test
      - name: pytest
        run: python -m pytest tests/ -q
      - name: catalog regen is idempotent
        run: |
          python scripts/gen_catalog.py
          git diff --exit-code db/seed_catalog.sql
