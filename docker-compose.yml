services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./scena.db:/app/scena.db
      - ./media:/app/media
      - ./backups:/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  bot:
    build: .
    env_file: .env
    command: ["python", "-m", "app.bot"]
    volumes:
      - ./scena.db:/app/scena.db
    depends_on:
      - api
    restart: unless-stopped
    profiles: ["bot"]   # запускать когда нужен polling: docker compose --profile bot up
